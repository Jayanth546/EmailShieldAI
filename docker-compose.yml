services:
  emailshieldai:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: emailshieldai:latest
    container_name: emailshieldai

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: sqlite:////app/data/emailshield.db

    ports:
      - "8000:8000"

    volumes:
      - emailshield_data:/app/data
      - emailshield_reports:/app/reports

    restart: unless-stopped

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

volumes:
  emailshield_data:
  emailshield_reports:
