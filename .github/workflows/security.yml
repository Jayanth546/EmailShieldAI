name: EmailShieldAI Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate ephemeral CI JWT secret
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit detect-secrets

      - name: Verify critical dependencies
        run: |
          python -c "import reportlab; print('reportlab:', reportlab.Version)"
          python -c "import joblib; print('joblib:', joblib.__version__)"
          python -c "import httpx2; print('httpx2:', httpx2.__version__)"
          python -c "import jwt; print('PyJWT:', jwt.__version__)"

      - name: Run tests
        run: |
          pytest -q

      - name: Run Bandit
        run: |
          bandit -r app -ll

      - name: Run pip-audit
        run: |
          pip-audit

      - name: Run detect-secrets
        run: |
          detect-secrets scan --exclude-files '(^|/)\.git/.*'
