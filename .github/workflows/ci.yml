name: EmailShieldAI CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Python compile check
        working-directory: backend
        run: |
          python -m compileall app ml

      - name: Run tests
        working-directory: backend
        run: |
          pytest -v

      - name: Ruff lint
        working-directory: backend
        run: |
          ruff check app ml

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  docker:
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    needs:
      - test
      - trivy-fs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t emailshieldai:${{ github.sha }} \
            ./backend

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: emailshieldai:${{ github.sha }}
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
